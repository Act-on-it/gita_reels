name: Daily Gita Reel

on:
  schedule:
    - cron: '30 1 * * *'   # 7:00 AM IST (1:30 AM UTC) every day
  workflow_dispatch:         # manual trigger from GitHub UI

# Prevent concurrent runs — only one reel posts at a time
concurrency:
  group: daily-reel
  cancel-in-progress: false  # never cancel an in-progress post

# Minimal permissions at workflow level — steps get only what they need
permissions:
  contents: read

jobs:
  post-reel:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    permissions:
      contents: write        # needed only for pushing progress.json

    env:
      PYTHON_VERSION: '3.11'

    steps:
      # ── 1. CHECKOUT ───────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      # ── 2. PYTHON SETUP ───────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # ── 3. CACHE APT PACKAGES ─────────────────────────────────────────────
      - name: Cache apt packages
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-manim-ubuntu22-v2

      - name: Install system dependencies
        if: steps.cache-apt.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            fonts-noto-core \
            fonts-noto-extra \
            pkg-config \
            python3-dev \
            libgirepository1.0-dev \
            gir1.2-pango-1.0

      - name: Install cached apt packages (cache hit)
        if: steps.cache-apt.outputs.cache-hit == 'true'
        run: |
          sudo dpkg -i /var/cache/apt/archives/*.deb 2>/dev/null || \
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives=/var/cache/apt/archives \
            ffmpeg libcairo2-dev libpango1.0-dev fonts-noto-core fonts-noto-extra \
            pkg-config python3-dev libgirepository1.0-dev gir1.2-pango-1.0

      # ── 4. INSTALL PYTHON DEPENDENCIES ─────────────────────────────────
      - name: Install Python dependencies
        run: pip install --upgrade pip --quiet && pip install -r requirements.txt --quiet

      # ── 5. VALIDATE INPUTS ────────────────────────────────────────────────
      # Fail fast before spending time on video render
      - name: Validate secrets and shloka index
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
        run: |
          python - <<'EOF'
          import os, json, sys

          token = os.environ.get("IG_ACCESS_TOKEN", "")
          uid   = os.environ.get("IG_USER_ID", "")

          if not token:
              print("::error::IG_ACCESS_TOKEN secret is not set"); sys.exit(1)
          if not uid:
              print("::error::IG_USER_ID secret is not set"); sys.exit(1)
          if len(token) < 50:
              print("::error::IG_ACCESS_TOKEN looks truncated (too short)"); sys.exit(1)

          with open("progress.json") as f:
              idx = json.load(f)["last_posted_index"]
          with open("shlokas.json", encoding="utf-8") as f:
              total = len(json.load(f))

          next_idx = idx + 1
          if next_idx >= total:
              print(f"::notice::All {total} shlokas posted — resetting to index 0")
              with open("progress.json", "w") as f:
                  json.dump({"last_posted_index": -1}, f)
              next_idx = 0

          print(f"::notice::Posting shloka {next_idx + 1} of {total}")
          print("✅ All inputs valid")
          EOF

      # ── 6. AUTO TOKEN REFRESH ─────────────────────────────────────────────
      # Refreshes IG token when ≤50 days remain and updates the GitHub Secret
      - name: Refresh Instagram token if due
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAT_TOKEN:       ${{ secrets.PAT_TOKEN }}
          REPO:            ${{ github.repository }}
        run: |
          python - <<'EOF'
          import os, json, time, base64, requests, sys

          token     = os.environ["IG_ACCESS_TOKEN"]
          pat_token = os.environ["PAT_TOKEN"]
          repo      = os.environ["REPO"]
          env_file  = os.environ["GITHUB_ENV"]

          # Attempt a refresh — Instagram API allows refresh when token has <60d left
          r = requests.get(
              "https://graph.instagram.com/refresh_access_token",
              params={"grant_type": "ig_refresh_token", "access_token": token},
              timeout=15
          )

          if r.ok:
              new_token  = r.json().get("access_token", token)
              expires_in = r.json().get("expires_in", 0)
              print(f"⟳  Token refreshed — new expiry: {expires_in // 86400} days")

              # Encrypt new token and update GitHub Secret via API
              try:
                  from nacl import encoding, public as nacl_public

                  headers = {
                      "Authorization": f"Bearer {pat_token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28"
                  }
                  key_r = requests.get(
                      f"https://api.github.com/repos/{repo}/actions/secrets/public-key",
                      headers=headers, timeout=10
                  )
                  key_r.raise_for_status()
                  kd       = key_r.json()
                  pub_key  = nacl_public.PublicKey(kd["key"].encode(), encoding.Base64Encoder())
                  sealed   = nacl_public.SealedBox(pub_key).encrypt(new_token.encode())
                  enc_val  = base64.b64encode(sealed).decode()

                  upd = requests.put(
                      f"https://api.github.com/repos/{repo}/actions/secrets/IG_ACCESS_TOKEN",
                      headers=headers,
                      json={"encrypted_value": enc_val, "key_id": kd["key_id"]},
                      timeout=10
                  )
                  upd.raise_for_status()
                  print("✅ GitHub Secret IG_ACCESS_TOKEN auto-updated")
              except Exception as e:
                  # Non-fatal — log warning, continue with refreshed token for this run
                  print(f"::warning::Could not update GitHub Secret: {e}")

              with open(env_file, "a") as f:
                  f.write(f"IG_ACCESS_TOKEN={new_token}\n")
          else:
              err_msg = r.json().get("error", {}).get("message", "unknown")
              # "not yet eligible" = token is still fresh, no action needed
              if "not yet eligible" in err_msg:
                  print("✅ Token is fresh — no refresh needed")
              else:
                  print(f"::warning::Token refresh check returned: {err_msg}")
              with open(env_file, "a") as f:
                  f.write(f"IG_ACCESS_TOKEN={token}\n")
          EOF

      # ── 7. GENERATE VIDEO ─────────────────────────────────────────────────
      - name: Generate shloka video
        run: python generate_video.py

      # ── 8. VERIFY VIDEO OUTPUT ────────────────────────────────────────────
      - name: Verify video was created correctly
        run: |
          if [ ! -f "shloka_video.mp4" ]; then
            echo "::error::shloka_video.mp4 not found — generate_video.py failed"
            exit 1
          fi
          SIZE=$(stat -c%s "shloka_video.mp4")
          echo "Video size: ${SIZE} bytes"
          if [ "$SIZE" -lt 50000 ]; then
            echo "::error::Video too small (${SIZE} bytes) — likely corrupted"
            exit 1
          fi
          echo "✅ Video OK (${SIZE} bytes)"

      # ── 9. HOST VIDEO VIA GITHUB RELEASE ──────────────────────────────────
      - name: Upload video to GitHub Release (public URL for Meta API)
        id: upload_video
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="reel-$(date +%Y%m%d-%H%M%S)"

          # Create the release and upload the video asset
          gh release create "$TAG" shloka_video.mp4 \
            --title "Reel $TAG" \
            --notes "Auto-generated daily Gita reel" \
            --repo ${{ github.repository }}

          # Wait for GitHub to process the asset — retry up to 10 times (30s max)
          ASSET_URL=""
          for i in $(seq 1 10); do
            ASSET_URL=$(gh release view "$TAG" \
              --repo ${{ github.repository }} \
              --json assets \
              --jq '.assets[0].browserDownloadUrl // empty')

            if [ -n "$ASSET_URL" ]; then
              echo "✅ Asset ready on attempt ${i}: ${ASSET_URL}"
              break
            fi

            echo "⏳ Attempt ${i}/10 — asset not ready yet, waiting 3s..."
            sleep 3
          done

          # Fail fast if URL is still empty after all retries
          if [ -z "$ASSET_URL" ]; then
            echo "::error::GitHub asset URL never became available after 30s"
            exit 1
          fi

          echo "VIDEO_URL=${ASSET_URL}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "✅ Video hosted at: ${ASSET_URL}"

      # ── 10. POST TO INSTAGRAM ─────────────────────────────────────────────
      - name: Post reel to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ env.IG_ACCESS_TOKEN }}
          VIDEO_URL:  ${{ env.VIDEO_URL }}
        run: python upload.py

      # ── 11. CLEAN UP OLD RELEASES ─────────────────────────────────────────
      # Keeps only the last 10 releases to avoid GitHub storage bloat
      - name: Clean up old GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list \
            --repo ${{ github.repository }} \
            --limit 100 \
            --json tagName,createdAt \
          | python3 - <<'EOF'
          import json, sys, subprocess
          releases = json.load(sys.stdin)
          releases.sort(key=lambda r: r["createdAt"])
          to_delete = releases[:-10]
          for r in to_delete:
              subprocess.run(
                  ["gh", "release", "delete", r["tagName"], "--yes", "--cleanup-tag"],
                  check=False
              )
          print(f"✅ Kept {min(10, len(releases))}, deleted {len(to_delete)} old releases")
          EOF

      # ── 12. COMMIT PROGRESS ───────────────────────────────────────────────
      - name: Commit updated progress.json
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SHLOKA_IDX=$(python3 -c "import json; print(json.load(open('progress.json'))['last_posted_index'])")
          git add progress.json
          git diff --staged --quiet || \
            git commit -m "chore: shloka #${SHLOKA_IDX} posted [skip ci]"
          git push

      # ── 13. FAILURE SUMMARY ───────────────────────────────────────────────
      - name: Print failure summary
        if: failure()
        run: |
          echo "::error::Daily Gita Reel workflow FAILED"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Check the steps above for the exact failure point."
